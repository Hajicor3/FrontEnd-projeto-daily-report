<div class="content-grid">
  <div>
    <div class="card-header">
      <div>
        <div class="card-header-title">
          <span>Atividades de hoje</span>
        </div>
        <div class="card-header-subtitle">
          <span>data de hoje</span>
        </div>
      </div>
      <div>
        <div style="text-align: right;">
          <div class="card-header-total">5h</div>
          <div class="card-header-label">TOTAL DO DIA</div>
        </div>
      </div>
    </div>
    <div class="card-content">
      <ul class="activity-list">
        <li class="activity-item clickable-row" *ngFor="let item of atividades() | slice:0:3" [routerLink]="['/atividade', item.id]">
          <div class="activity-item-time">
            {{ item.horaInicio | slice:0:5 }} - {{ item.horaFim | slice:0:5 }}
          </div>
          <div class="activity-item-details">
            <div class="activity-item-title">{{ item.titulo }}</div>
            <div class="activity-item-company">{{ item.empresaNome }}</div>
          </div>
          <div class="activity-item-duration">{{ item.minutosTrabalhados }} min</div>
      </li>
      </ul>
       <a class="view-all-link" href="atividades">Ver todas as atividades →</a>
    </div>
  </div>
  <app-chart-hours [atividades]="atividades()" [empresas]="empresas()"></app-chart-hours>
</div>
